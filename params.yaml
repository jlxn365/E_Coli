random_state: 42
n_splits: 5

data_dir: "./data"
cache_dir: "./cache"

# Frequency filter (share of rows where the feature is non-zero)
freq_lower_bound: 0.01
freq_higher_bound: 0.97

# Logistic Regression: chi2 -> SVD -> scaler -> LR
lr:
    k: 20000
    svd_components: 400
    C: 0.001
    max_iter: 3000

# LightGBM: chi2 band -> LGBM importance -> final LGBM
lgbm:
    skip_top: 10000
    k_filter: 80000
    k_final: 15000
    ranker_params:
        learning_rate: 0.05
        n_estimators: 400
        num_leaves: 63
        subsample: 0.8
        colsample_bytree: 0.8
    final_params:
        n_estimators: 2000
        learning_rate: 0.08
        num_leaves: 31
        min_child_samples: 10
        reg_lambda: 3.0

# XGBoost: gain importance -> top-K -> several seeds
xgb:
    k_final: 10000
    seeds: [0, 1, 2, 3, 4]
    num_boost_round: 334
    params:
        max_depth: 5
        learning_rate: 0.14057600643664633
        subsample: 0.6839621173684199
        colsample_bytree: 0.8580105497240765
        colsample_bylevel: 0.9719717270864711
        colsample_bynode: 0.5824175873213119
        reg_alpha: 1.3656889401717721e-05
        reg_lambda: 1.5542897394923756
        gamma: 0.1561157815525849
        scale_pos_weight: 4.131438496827203
        tree_method: "hist"
        device: "cuda"   # mettre "cpu" si pas de GPU
        n_jobs: -1

# Meta-model
stacking:
    C_grid: [0.03, 0.1, 0.3, 1, 3, 10]
